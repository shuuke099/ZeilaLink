name: Deploy ZeilaLink

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            echo "=============================="
            echo "Starting ZeilaLink Deployment"
            echo "=============================="

            cd ~/apps/ZeilaLink

            # The frontend proxies /api to the backend on this same server.
            # Export these values for both `next build` and the PM2 restart.
            export INTERNAL_API_ORIGIN="http://127.0.0.1:7000"
            export NEXT_PUBLIC_API_URL="/api"
            export NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || 'https://zeilalink.com' }}"
            export NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION="${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}"
            export NEXT_PUBLIC_BING_SITE_VERIFICATION="${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}"
            export NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}"

            # Back up manifests and lockfiles together: server-side installs
            # can modify both. Restoring only the lockfile leaves a mismatched
            # dependency set. Do not reapply the backup during deployment.
            # Explicit paths leave .env, uploads, and other server edits alone.
            set -- package.json frontend/package.json backend/package.json pnpm-lock.yaml package-lock.json pnpm-workspace.yaml
            if ! git diff --quiet -- "$@" || ! git diff --cached --quiet -- "$@"; then
              echo "Backing up server dependency edits..."
              git stash push -m "deployment-dependencies-backup-$(date -u +%Y%m%dT%H%M%SZ)" -- "$@"
              echo "Dependency backup saved in git stash. Other server files were left unchanged."
            fi

            echo "Pull latest code..."
            git pull --ff-only origin main

            echo "Install dependencies..."
            pnpm install --frozen-lockfile

            echo "Generate Prisma Client..."
            cd backend
            pnpm prisma generate
            cd ..

            echo "Build application..."
            pnpm build

            echo "Run Prisma migrations..."
            cd backend
            pnpm prisma migrate deploy
            cd ..

            echo "Restart PM2..."
            pm2 restart ecosystem.config.js --update-env

            echo "Save PM2..."
            pm2 save

            echo "Check restarted services..."
            wait_for_service() {
              service_name="$1"
              service_url="$2"

              for attempt in $(seq 1 12); do
                # Match HTTPS forwarding from the trusted local reverse proxy.
                # curl -f alone also accepts redirects, which are not health.
                if service_status=$(curl -sS --max-time 10 -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' "$service_url") && [ "$service_status" = "200" ]; then
                  echo "$service_name is healthy."
                  return 0
                fi

                echo "Waiting for $service_name ($attempt/12)..."
                sleep 5
              done

              echo "$service_name did not become healthy."
              pm2 status
              pm2 logs "$service_name" --lines 100 --nostream
              return 1
            }

            wait_for_service "zeilalink-backend" "http://127.0.0.1:7000/health"
            wait_for_service "zeilalink-frontend" "http://127.0.0.1:3000/"

            # A healthy homepage alone can still be served by an old process.
            # This read-only request must reach the updated upload router.
            echo "Verify deployed upload handler and ZeilaMart page..."
            for origin in "http://127.0.0.1:7000" "http://127.0.0.1:3000" "${NEXT_PUBLIC_SITE_URL}"; do
              if ! upload_headers=$(curl -sS --max-time 15 -H 'X-Forwarded-Proto: https' -D - -o /dev/null "$origin/api/uploads"); then
                echo "Could not reach upload handler at $origin."
                exit 1
              fi
              if ! printf '%s\n' "$upload_headers" | grep -qi '^X-ZeilaLink-Upload-Policy: normalized-images-v2'; then
                echo "Upload handler verification failed at $origin. Check the deployed build and proxy target."
                printf '%s\n' "$upload_headers" | grep -iE '^(HTTP/|Location:)' || true
                exit 1
              fi
            done
            curl -fsS --max-time 15 "${NEXT_PUBLIC_SITE_URL}/zeilamart" > /dev/null

            echo "Check public SEO endpoints..."
            for public_path in "/" "/robots.txt" "/sitemap.xml"; do
              if ! curl -fsS --max-time 15 "${NEXT_PUBLIC_SITE_URL}${public_path}" > /dev/null; then
                echo "WARNING: ${NEXT_PUBLIC_SITE_URL}${public_path} is not publicly reachable."
                echo "Check DNS, TLS, firewall, and the reverse proxy before requesting indexing."
              fi
            done

            echo ""
            echo "Deployment completed successfully."
